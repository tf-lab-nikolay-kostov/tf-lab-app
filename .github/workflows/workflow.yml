name: CI Workflow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-workflow:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-8-jre-headless
          pip3 install pytest pytest-xdist
          pip3 install "requests==2.21.0" "urllib3==1.24.3" "six==1.12.0" zapcli

      - name: Install OWASP ZAP
        run: |
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.16.0/ZAP_2.16.0_Linux.tar.gz
          tar -xvzf ZAP_2.16.0_Linux.tar.gz
          echo "ZAP_PATH=$PWD/ZAP_2.16.0" >> $GITHUB_ENV

      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Build Application (SCA)
        run: npm install

      - name: Run ESLint (SAST)
        run: npx eslint . --ext .js

      - name: Run app
        run: |
          node index.js &
          npx wait-on http://localhost:8888
        env:
          FRONTEND_URL: "http://localhost"
          JWT_SECRET: "randomstring"
          MONGODB_URI: "mongodb://localhost:27017/dummyjson"

      - name: Start ZAP
        run: |
          AUTH_RESPONSE=$(curl -s -X POST \
            -H 'Content-Type: application/json' \
            "http://localhost:8888/auth/login" \
            -d "{\"username\":\"${{ secrets.USERNAME }}\",\"password\":\"${{ secrets.PASSWORD }}\"}")

          AUTH_TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.accessToken // .token // empty')

          if [ -n "$AUTH_TOKEN" ]; then
            echo "ZAP_AUTH_HEADER_VALUE=Bearer $AUTH_TOKEN" >> "$GITHUB_ENV"
            echo "ZAP_AUTH_HEADER=Authorization" >> "$GITHUB_ENV"
          else
            echo "Warning: application login returned no token; continuing with an unauthenticated ZAP scan."
          fi

          $ZAP_PATH/zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true &
          sleep 30

      - name: Run ZAP scan (DAST)
        run: |
          zap-cli -p 8090 status -t 120
          zap-cli -p 8090 -v quick-scan \
            --spider \
            "http://localhost:8888/"

      - name: Stop App and ZAP
        if: always()
        run: |
          zap-cli -p 8090 shutdown || true
          kill "$(lsof -t -i:8888)" || true
