name: CI Workflow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci-workflow:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless jq
          java -version
          pip3 install pytest pytest-xdist

      - name: Install OWASP ZAP
        run: |
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.16.0/ZAP_2.16.0_Linux.tar.gz
          tar -xvzf ZAP_2.16.0_Linux.tar.gz
          echo "ZAP_PATH=$PWD/ZAP_2.16.0" >> "$GITHUB_ENV"

      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Build Application (SCA)
        run: npm install

      - name: Run ESLint (SAST)
        run: npx eslint . --ext .js

      - name: Run app
        run: |
          node index.js &
          npx wait-on http://localhost:8888
        env:
          FRONTEND_URL: "http://localhost"
          JWT_SECRET: "randomstring"
          MONGODB_URI: "mongodb://localhost:27017/dummyjson"

      - name: Start ZAP
        run: |
          $ZAP_PATH/zap.sh -daemon \
            -host 0.0.0.0 \
            -port 8090 \
            -config api.disablekey=true &

          for attempt in {1..30}; do
            if curl -fsS http://localhost:8090/JSON/core/view/version/ > /dev/null; then
              echo "ZAP is ready."
              exit 0
            fi

            echo "Waiting for ZAP to start..."
            sleep 5
          done

          echo "ZAP did not become ready in time."
          exit 1

      - name: Run ZAP scan (DAST)
        run: |
          set -euo pipefail

          ZAP_API="http://localhost:8090"
          TARGET="http://localhost:8888/"

          echo "Starting spider scan for $TARGET"
          SPIDER_ID=$(curl -fsS -G \
            "$ZAP_API/JSON/spider/action/scan/" \
            --data-urlencode "url=$TARGET" \
            --data-urlencode "recurse=true" \
            | jq -r '.scan')

          for attempt in {1..60}; do
            SPIDER_STATUS=$(curl -fsS \
              "$ZAP_API/JSON/spider/view/status/?scanId=$SPIDER_ID" \
              | jq -r '.status')

            echo "Spider progress: $SPIDER_STATUS%"

            if [ "$SPIDER_STATUS" = "100" ]; then
              break
            fi

            sleep 5
          done

          echo "Starting active scan for $TARGET"
          ACTIVE_SCAN_ID=$(curl -fsS -G \
            "$ZAP_API/JSON/ascan/action/scan/" \
            --data-urlencode "url=$TARGET" \
            --data-urlencode "recurse=true" \
            | jq -r '.scan')

          for attempt in {1..120}; do
            ACTIVE_STATUS=$(curl -fsS \
              "$ZAP_API/JSON/ascan/view/status/?scanId=$ACTIVE_SCAN_ID" \
              | jq -r '.status')

            echo "Active scan progress: $ACTIVE_STATUS%"

            if [ "$ACTIVE_STATUS" = "100" ]; then
              break
            fi

            sleep 5
          done

          echo "ZAP alerts found:"
          curl -fsS -G \
            "$ZAP_API/JSON/core/view/alerts/" \
            --data-urlencode "baseurl=$TARGET" \
            | jq '.alerts[] | {risk, alert, url}' || true

      - name: Stop App and ZAP
        if: always()
        run: |
          curl -s "http://localhost:8090/JSON/core/action/shutdown/" || true
          kill "$(lsof -t -i:8888)" || true
